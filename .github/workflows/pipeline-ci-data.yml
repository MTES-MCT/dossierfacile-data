name: Pipeline CI Data
on: pull_request

permissions:
  contents: read

env:
  DBT_PROFILES_DIR: .github
  POSTGRES_PASSWORD: ${{ secrets.DBT_POSTGRES_PASSWORD_TEST }}

jobs:
  run-ci-pipeline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.15
        ports:
          - "127.0.0.1:5432:5432"
        env:
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.x"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install dbt packages
        run: dbt deps

      - name: Test dbt database connection
        run: dbt debug

      - name: Create empty PostgreSQL sources
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -X --set ON_ERROR_STOP=1 --username postgres --dbname postgres < .github/ci-sources.sql

      # --empty adds a second alias to some ref() subqueries on PostgreSQL.
      # https://github.com/dbt-labs/dbt-core/issues/9967
      - name: Build models on the empty sources
        run: dbt run

      - name: Run dbt unit tests
        run: dbt test --select test_type:unit --warn-error-options '{"error":["NothingToDo"]}'

      - name: Test core_document incremental updates
        run: python tests/integration/core_document_incremental.py

      - name: Lint with SQLFluff
        run: sqlfluff lint --dialect postgres
