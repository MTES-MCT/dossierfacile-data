models:
  - name: core_document
    description: >-
      Document lifecycle joined to current source attributes, including category
      edits that do not emit document lifecycle events. Retains documents absent
      from the current source without inferring an unlogged deletion.
    columns:
      - name: document_id
        data_tests:
          - unique
          - not_null
      - name: total_add_document_events
        description: >-
          Count of retained add events from staging_document_status. Legacy events
          included saves and replacements, while DOCUMENT_ADDED records creation
          only. Values across the backend PR #1240 deployment are not a continuous
          replacement metric.
      - name: total_delete_document_events
        description: Count of retained legacy or dedicated document deletion events.
  - name: core_document_denied_reasons
    description: "A dbt model that transforms document denied reasons data, including document categories and denial details"
    columns:
      - name: unique_id
        description: "A surrogate key generated from id and denied_option_id"
        data_tests:
          - unique
          - not_null
      - name: document_denied_at
        description: "Timestamp when the document was denied"
        data_tests:
          - not_null
      - name: document_id
        description: "The ID of the document that was denied"
        data_tests:
          - not_null
      - name: denied_option_id
        description: "The ID of the denial reason option"
        data_tests:
          - not_null
      - name: denied_option_value
        description: "The value of the denial reason option"
        data_tests:
          - not_null
      - name: document_category
        description: "The category of the denied document (from staging_document_denied_reasons, falls back to staging_document_denied_options if null)"
      - name: document_sub_category
        description: "The sub-category of the denied document (from staging_document_denied_reasons, falls back to staging_document_denied_options if null)"
      - name: document_category_step
        description: "The step in the document category process"
      - name: document_tenant_type
        description: "Indicates whether the document belongs to a TENANT or GUARANTOR (from staging_document_denied_reasons, falls back to staging_document_denied_options if null)"
        data_tests:
          - accepted_values:
              name: unexpected_document_tenant_type
              arguments:
                values: ['TENANT', 'GUARANTOR', 'ALL']
              config:
                where: "document_tenant_type is not null"
      - name: operator_comment
        description: "Deprecated compatibility column; always contains '[REDACTED]'."
