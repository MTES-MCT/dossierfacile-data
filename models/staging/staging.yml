models:
  - name: staging_tenant_log
    description: "One row per tenant log. Casts source columns and extracts guarantor, document, and comment fields from log_details. tenant_type is GUARANTOR when guarantor_id is set, otherwise TENANT."
    columns:
      - name: id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null
      - name: tenant_id
        description: "The ID of the tenant associated with the log"
        data_tests:
          - not_null
      - name: operator_id
        description: "The ID of the operator who performed the action"
      - name: log_type
        description: "The type of log entry"
      - name: created_at
        description: "The timestamp when the log entry was created"
        data_tests:
          - not_null
  - name: staging_tenant
    description: "One row per tenant. Maps apartment_sharing_id to application_id and owner_type to beneficiary_type. zip_code keeps the first five digits, stays null when missing, and becomes 'invalid' otherwise. Null status is stored as INCOMPLETE."
    columns:
      - name: id
        description: "The primary key for the tenant table"
        data_tests:
          - unique
          - not_null
      - name: tenant_type
        description: "The type of tenant"
        data_tests:
          - not_null
      - name: status
        description: "The current status of the tenant"
        data_tests:
          - not_null
      - name: application_id
        description: "The ID of the application (apartment_sharing in code)"
      - name: zip_code
        description: "The zip code of the tenant's address"
      - name: honor_declaration
        description: "Flag indicating if the tenant has made an honor declaration"
      - name: last_updated_at
        description: "The timestamp of the last update to the tenant record"
      - name: deletion_warnings
        description: "The number of warnings before deletion"
      - name: validation_requested
        description: "Explicit choice of the tenant about operator validation (COMPLETED opt-in): null = never answered, true = requested a validation, false = explicitly declined"
  - name: staging_document_denied_options
    description: "One row per denial option in the catalog. Renames message_value to denied_option_value and uppercases document_user_type as document_tenant_type."
    columns:
      - name: id
        description: "The primary key for the denied options table"
        data_tests:
          - unique
          - not_null
      - name: denied_option_value
        description: "The message value of the denied option"
      - name: document_category
        description: "The category of the document"
      - name: document_sub_category
        description: "The sub category of the document"
      - name: document_tenant_type
        description: "Indicates whether the document belongs to a TENANT or GUARANTOR"
      - name: code
        description: "The associated code to the denied option"
  - name: staging_document_denied_reasons
    description: "One row per checked denial option on a document denial. Unnests checked_options_id and checked_options, so the source id is repeated. Fixes the encoding of the option text and uppercases document_tenant_type."
    columns:
      - name: id
        description: "The ID of the denied reason record"
        data_tests:
          - not_null
      - name: denied_option_id
        description: "The ID of the denial reason option"
        data_tests:
          - not_null
      - name: denied_option_value
        description: "The value of the denial reason option"
        data_tests:
          - not_null
      - name: document_id
        description: "The ID of the document that was denied"
        data_tests:
          - not_null
      - name: document_denied_at
        description: "Timestamp when the document was denied"
        data_tests:
          - not_null
      - name: document_category
        description: "The category of the denied document"
      - name: document_sub_category
        description: "The sub-category of the denied document"
      - name: document_category_step
        description: "The step in the document category process"
      - name: document_tenant_type
        description: "Indicates whether the document belongs to a TENANT or GUARANTOR"
  - name: staging_feature_flag
    description: "One row per feature flag. Typed cast of the feature_flag source."
    columns:
      - name: key
        description: "The feature flag identifier"
      - name: description
        description: "Human-readable feature flag description"
      - name: active
        description: "Whether the feature flag is active"
      - name: only_for_new_user
        description: "Whether the flag applies only to new users"
      - name: rollout_pct
        description: "Rollout percentage for gradual activation"
      - name: deployment_date
        description: "Planned or actual deployment timestamp"
      - name: created_at
        description: "Feature flag creation timestamp"
      - name: updated_at
        description: "Feature flag last update timestamp"
  - name: staging_user_feature_history
    description: "One row per change in a user's feature assignment. Typed cast of user_feature_assignment_history."
    columns:
      - name: id
        description: "The primary key for the user feature assignment history table"
        data_tests:
          - unique
          - not_null
      - name: user_id
        description: "The user identifier receiving feature assignment"
      - name: feature_key
        description: "The feature flag key assigned to the user"
      - name: enabled
        description: "Whether the feature is enabled for the user"
      - name: bucket
        description: "The assignment bucket used for rollout logic"
      - name: rollout_pct
        description: "Rollout percentage applied at assignment time"
      - name: changed_at
        description: "Timestamp when the assignment was changed"
      - name: reason
        description: "Reason that changed the feature assignment: FIRST_CHECK, ROLLOUT_INCREASED"
